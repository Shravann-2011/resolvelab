[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolvelab"
version = "0.1.0"
description = "A tool-using support resolution agent with an evaluation lab that scores actions, not just replies."
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
claude = ["anthropic>=0.40"]

[project.scripts]
resolvelab-mcp = "resolvelab.mcp_server:main"
resolvelab-seed = "resolvelab.seed:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
